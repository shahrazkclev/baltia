<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Video Carousel</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        html, body { 
            margin: 0 !important;
            padding: 0 !important;
            background: transparent; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
        }
        
        .carousel-container { 
            width: 100% !important;
            height: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            box-sizing: border-box !important;
        }
        
        .video-player-container { 
            width: 100%; 
            border-radius: 16px; 
            overflow: hidden; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            display: flex; 
            flex-direction: column; 
        }
        
        .video-wrapper { 
            position: relative; 
            width: 100%; 
            aspect-ratio: 1920/1398; 
            border-radius: 16px 16px 0 0; 
            overflow: hidden; 
            background: #000; 
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        
        .stream-iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            cursor: pointer; 
            display: block;
            transform: translateZ(0) scale(1.01);
            -webkit-transform: translateZ(0) scale(1.01);
            transition: transform 0.3s ease;
        }
        
        .stream-iframe.playing {
            transform: translateZ(0) scale(1);
            -webkit-transform: translateZ(0) scale(1);
        }
        
        .controls-panel { 
            backdrop-filter: blur(8px); 
            background: rgba(0, 0, 0, 0.3); 
            border-radius: 0 0 16px 16px; 
            padding: 16px 20px !important; 
            display: flex; 
            align-items: center; 
            border-top: none;
        }
        
        .controls-inner { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            gap: 16px; 
            width: 100%; 
            padding: 0 !important; 
        }
        
        .thumbnail-carousel { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            overflow-x: auto; 
            overflow-y: hidden;
            flex: 1; 
            justify-content: flex-start; 
            scrollbar-width: none;
            -ms-overflow-style: none;
            max-width: calc(100% - 100px);
            scroll-behavior: smooth;
        }
        
        .thumbnail-carousel::-webkit-scrollbar { 
            display: none; 
        }
        
        .thumbnail-item { 
            flex-shrink: 0; 
            width: 60px; 
            height: 42px; 
            border-radius: 6px; 
            overflow: hidden; 
            cursor: pointer; 
            transition: border-color 0.2s ease; 
            border: 2px solid transparent; 
        }
        
        .thumbnail-item:hover { 
            border-color: rgba(255, 255, 255, 0.4); 
        }
        
        .thumbnail-item.active { 
            border-color: rgba(255, 255, 255, 0.9); 
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.2); 
        }
        
        .thumbnail-img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            background: rgba(0, 0, 0, 0.3); 
        }
        
        .btn { 
            backdrop-filter: blur(8px); 
            background: rgba(0, 0, 0, 0.3); 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            border-radius: 10px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: all 0.2s; 
            width: 36px; 
            height: 36px; 
        }
        
        .btn:hover { 
            background: rgba(0, 0, 0, 0.45); 
            transform: scale(1.05); 
        }
        
        svg { 
            width: 22px; 
            height: 22px; 
            stroke: white; 
            fill: none; 
            stroke-width: 2; 
        }
        
        @media (max-width: 768px) {
            .controls-panel { 
                padding: 10px 16px !important; 
            }
            .controls-inner { 
                gap: 12px; 
            }
            .thumbnail-carousel { 
                max-width: calc(100% - 80px); 
            }
            .thumbnail-item { 
                width: 50px; 
                height: 35px; 
            }
        }
        
        @media (max-width: 480px) {
            .controls-panel { 
                padding: 10px 12px !important; 
            }
            .controls-inner { 
                gap: 8px; 
            }
            .thumbnail-carousel { 
                max-width: calc(100% - 70px); 
            }
            .thumbnail-item { 
                width: 45px; 
                height: 32px; 
            }
        }
        
        @keyframes pulse {
            0%, 100% { 
                opacity: 0.4;
                transform: scale(1);
            }
            50% { 
                opacity: 0.8;
                transform: scale(1.02);
            }
        }
        
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        
        @keyframes breathe {
            0%, 100% { 
                opacity: 0.3;
                transform: scale(0.98);
            }
            50% { 
                opacity: 0.7;
                transform: scale(1.01);
            }
        }
    </style>
</head>
<body>
    <div class="carousel-container">
        <div class="video-player-container">
            <div class="video-wrapper">
                <iframe id="streamPlayer" class="stream-iframe" loading="lazy" allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;" allowfullscreen="true"></iframe>
            </div>
            <div class="controls-panel">
                <div class="controls-inner">
                    <button class="btn" id="prevBtn"><svg><polyline points="15 18 9 12 15 6"></polyline></svg></button>
                    <div class="thumbnail-carousel" id="thumbnailCarousel"></div>
                    <button class="btn" id="nextBtn"><svg><polyline points="9 18 15 12 9 6"></polyline></svg></button>
                </div>
            </div>
        </div>
    </div>
    <script>
        var vids = [];
        var currentIndex = 0;
        var hasUserInteraction = false;
        var streamDomain = "customer-aanhjdlw75bwi5za.cloudflarestream.com";
        var streamPlayer = document.getElementById('streamPlayer');
        var thumbnailCarousel = document.getElementById('thumbnailCarousel');
        var preloadedVideos = new Set();
        
        // Supabase configuration
        var supabaseUrl = 'https://mixifcnokcmxarpzwfiy.supabase.co';
        var supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1peGlmY25va2NteGFycHp3Zml5Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc1MzQ2NjA1MSwiZXhwIjoyMDY5MDQyMDUxfQ.aS2ZadBAyOh71T3N3FryBMyAZZy9gkn1D6mz03ae6JQ';
        
        // Fetch videos from Supabase (fast)
        async function fetchVideos() {
            try {
                var response = await fetch(supabaseUrl + '/rest/v1/baltay?select=streamid,name&order=created_at.desc', {
                    method: 'GET',
                    headers: {
                        'apikey': supabaseKey,
                        'Authorization': 'Bearer ' + supabaseKey,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation'
                    }
                });
                
                if (!response.ok) {
                    throw new Error('Failed to fetch from Supabase');
                }
                
                var data = await response.json();
                
                // Transform Supabase data to match expected format
                return data.map(function(video) {
                    return {
                        streamId: video.streamid || video.streamId, // Handle both lowercase and camelCase
                        name: video.name || 'Untitled Video'
                    };
                });
            } catch (error) {
                console.error('Failed to fetch videos from Supabase:', error);
                return [];
            }
        }
        
        // Show skeleton loader
        function showSkeletonLoader() {
            thumbnailCarousel.innerHTML = '';
            // Create 8 skeleton thumbnail items with staggered animation
            for (var i = 0; i < 8; i++) {
                var skeletonDiv = document.createElement('div');
                skeletonDiv.className = 'thumbnail-item';
                skeletonDiv.style.background = 'linear-gradient(90deg, rgba(255,255,255,0.08) 25%, rgba(255,255,255,0.15) 50%, rgba(255,255,255,0.08) 75%)';
                skeletonDiv.style.backgroundSize = '200% 100%';
                skeletonDiv.style.animation = 'breathe 2s ease-in-out infinite, shimmer 2s ease-in-out infinite';
                skeletonDiv.style.animationDelay = (i * 0.1) + 's';
                skeletonDiv.style.border = '2px solid rgba(255, 255, 255, 0.1)';
                skeletonDiv.style.borderRadius = '6px';
                thumbnailCarousel.appendChild(skeletonDiv);
            }
            
            // Add skeleton video player background with breathing effect
            var videoWrapper = document.querySelector('.video-wrapper');
            if (videoWrapper) {
                videoWrapper.style.background = 'linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.12) 50%, rgba(255,255,255,0.05) 75%)';
                videoWrapper.style.backgroundSize = '200% 100%';
                videoWrapper.style.animation = 'shimmer 2.5s ease-in-out infinite, breathe 3s ease-in-out infinite';
            }
        }
        
        // Initialize carousel with fetched videos
        async function initializeCarousel() {
            // Show skeleton loader
            showSkeletonLoader();
            
            // Fetch videos from API
            vids = await fetchVideos();
            
            // Remove skeleton animation from video wrapper
            var videoWrapper = document.querySelector('.video-wrapper');
            if (videoWrapper) {
                videoWrapper.style.background = '#000';
                videoWrapper.style.animation = 'none';
            }
            
            if (vids.length === 0) {
                thumbnailCarousel.innerHTML = '<div style="color: white; padding: 20px; text-align: center;">No videos found</div>';
                return;
            }
            
            // Initialize carousel with fetched videos
            createThumbnails();
            jumpToVideo(0);
        }
        
        function buildStreamUrl(streamId) {
            return "https://" + streamDomain + "/" + streamId + "/iframe?preload=true&loop=true&poster=" + encodeURIComponent("https://" + streamDomain + "/" + streamId + "/thumbnails/thumbnail.jpg?time=&height=600");
        }
        
        function buildThumbnailUrl(streamId) {
            return "https://" + streamDomain + "/" + streamId + "/thumbnails/thumbnail.jpg?time=0&height=60";
        }
        
        function createThumbnails() {
            thumbnailCarousel.innerHTML = '';
            vids.forEach(function(vid, index) {
                var div = document.createElement('div');
                div.className = 'thumbnail-item' + (index === currentIndex ? ' active' : '');
                div.onclick = function() { jumpToVideo(index); };
                
                var img = document.createElement('img');
                img.className = 'thumbnail-img';
                img.loading = 'lazy';
                img.src = buildThumbnailUrl(vid.streamId);
                
                div.appendChild(img);
                thumbnailCarousel.appendChild(div);
            });
        }
        
        function preloadVideo(index) {
            if (preloadedVideos.has(index)) return;
            
            var video = vids[index];
            var preloadIframe = document.createElement('iframe');
            preloadIframe.style.display = 'none';
            preloadIframe.style.position = 'absolute';
            preloadIframe.style.left = '-9999px';
            preloadIframe.style.top = '-9999px';
            preloadIframe.src = buildStreamUrl(video.streamId) + "&muted=true";
            preloadIframe.setAttribute('sandbox', 'allow-scripts allow-same-origin');
            
            try {
                document.body.appendChild(preloadIframe);
                preloadedVideos.add(index);
                
                // Remove preload iframe after a delay
                setTimeout(function() {
                    try {
                        if (preloadIframe.parentNode) {
                            preloadIframe.parentNode.removeChild(preloadIframe);
                        }
                    } catch(e) {
                        // Silently handle cleanup errors
                    }
                }, 5000);
            } catch(e) {
                // Silently handle preload errors
            }
        }
        
        function preloadAdjacentVideos() {
            var prevIndex = (currentIndex - 1 + vids.length) % vids.length;
            var nextIndex = (currentIndex + 1) % vids.length;
            
            preloadVideo(prevIndex);
            preloadVideo(nextIndex);
        }
        
        function jumpToVideo(index) {
            currentIndex = index;
            var currentVideo = vids[index];
            
            // Completely clear and reload iframe
            streamPlayer.src = '';
            streamPlayer.classList.remove('playing');
            
            setTimeout(function() {
                var url = buildStreamUrl(currentVideo.streamId);
                streamPlayer.src = url;
            }, 150);
            
            updateThumbnails();
            
            // Preload adjacent videos for smooth navigation
            preloadAdjacentVideos();
        }
        
        function updateThumbnails() {
            var thumbnails = thumbnailCarousel.querySelectorAll('.thumbnail-item');
            thumbnails.forEach(function(thumb, i) {
                thumb.classList.toggle('active', i === currentIndex);
            });
            
            var activeThumbnail = thumbnailCarousel.querySelector('.thumbnail-item.active');
            if (activeThumbnail) {
                activeThumbnail.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
        }
        
        function nextVideo() {
            jumpToVideo((currentIndex + 1) % vids.length);
        }
        
        function prevVideo() {
            jumpToVideo((currentIndex - 1 + vids.length) % vids.length);
        }
        
        document.getElementById('prevBtn').onclick = prevVideo;
        document.getElementById('nextBtn').onclick = nextVideo;
        
        streamPlayer.addEventListener('play', function() {
            streamPlayer.classList.add('playing');
            hasUserInteraction = true;
            
            // Force unmute when video starts playing
            setTimeout(function() {
                try {
                    var iframe = streamPlayer;
                    if (iframe.contentWindow && iframe.contentWindow.postMessage) {
                        iframe.contentWindow.postMessage('{"event":"command","func":"unmute","args":""}', '*');
                        iframe.contentWindow.postMessage('{"event":"command","func":"setVolume","args":"100"}', '*');
                    }
                } catch(e) {
                    // Silently handle errors to reduce console noise
                }
            }, 100);
        });
        
        streamPlayer.addEventListener('pause', function() {
            streamPlayer.classList.remove('playing');
        });
        
        streamPlayer.addEventListener('ended', function() {
            // Loop the current video - no autoplay
            jumpToVideo(currentIndex);
        });
        
        // Initialize carousel by fetching videos from API
        initializeCarousel();
    </script>
</body>
</html>
